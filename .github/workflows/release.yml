name: Release
on:
  push:
    tags:
      - '*'

concurrency:
  group: 'production'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: production
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install lftp
      run: sudo apt-get update && sudo apt-get install -y lftp
    - name: Deploy via SFTP
      env:
        SFTP_SERVER: ${{ vars.FTP_SERVER }}
        SFTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        REMOTE_DIR: ${{ vars.REMOTE_DIR }}
      run: |
        lftp -c "
          set sftp:auto-confirm yes
          set net:max-retries 3
          open --env-password -u \"$SFTP_USERNAME\" sftp://$SFTP_SERVER:22
          mirror --reverse --verbose --parallel=4 \
            -x '(^|/)\.git' \
            -x '(^|/)node_modules/' \
            -x '^content/' \
            -x '^src/' \
            -x '^\.[^/]*rc$' \
            -x '^composer\.' \
            -x '^npm' \
            -x '^package\.json$' \
            -x '^vite\.config\.js$' \
            -x '^yarn' \
            ./ \"$REMOTE_DIR\"
        "
